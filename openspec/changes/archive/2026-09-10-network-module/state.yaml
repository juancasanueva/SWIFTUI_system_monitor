pre_proposal:
  status: confirmed
  asked_on: 2026-09-10
  confirmed_on: 2026-09-10
  decisions:
    colour_mapping: download = green (0x3DD68C), upload = blue (0x4D8DFF) for both badge and graph line
    totals_semantics: Total In / Total Out are since boot (raw 64-bit interface counter sums)
    rate_formatting: reuse ByteFormatter.throughput ("5,0 kB/s"); no integer variant
    interface_filter: IFT_ETHER + IFT_CELLULAR and not IFF_LOOPBACK; excludes lo0, utun*, bridge*, gif, stf; IFF_UP/IFF_RUNNING not required
    prd_scope: Draft v4 adds F11 Network card, milestone M6 Network, section 5.8; GPU renumbered to M7; F9 (menu bar NET module) stays Future
    popover_height: panel scrolls when taller than the screen's visibleFrame (four cards ~1050 pt vs ~945 pt usable on 14" at default scaling); in scope
    rate_text: reuse ThroughputLabel at 12 pt with arrow.down.circle.fill / arrow.up.circle.fill (or the design's SF Symbol pair); no larger badge component
    research_lane: unselected
  assumptions_unless_overridden:
    read_error_cases: design decision
    graph_floor_and_series_fill: design decision (floor about 10 kB/s recommended)
    overflow_cap_host_and_margin: design decision (PanelView injected maxHeight vs configurePopover; pure PanelLayout rule unit-tested either way)
    network_accent_value: sampled from the mockup at implementation (estimate 0xA66BFF), pinned in the palette test
    sf_symbol_names: design decision, download and upload icons must differ
    unavailable_caption: design decision

